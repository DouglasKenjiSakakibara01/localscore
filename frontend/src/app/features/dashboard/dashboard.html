<main class="page-shell">
  <section class="dashboard-card">
    <span class="eyebrow">Área autenticada</span>
    <h1>Olá, {{ authService.user()?.name }}!</h1>
    <dl>
      <div>
        <dt>Nome</dt>
        <dd>{{ authService.user()?.name }}</dd>
      </div>
      <div>
        <dt>E-mail</dt>
        <dd>{{ authService.user()?.email }}</dd>
      </div>
      <div>
        <dt>Sessão</dt>
        <dd>Autenticada</dd>
      </div>
    </dl>
    <div class="action-row">
      <a class="button button--primary" href="/app/championships">Ver campeonatos</a>
      <a class="button button--ghost" href="/app/teams">Ver equipes</a>
    </div>
  </section>
</main>
